name: Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Image to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.target == 'all' && '["backend", "frontend"]' || format('["{0}"]', inputs.target)) }}
        include:
          - name: backend
            dockerfile: compose/production/django/Dockerfile
          - name: frontend
            dockerfile: compose/production/frontend/Dockerfile
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          # Full history and tags so git describe matches the manual build
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(git describe --always)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: linea/skyviewer:${{ matrix.name }}_${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: echo "Pushed \`linea/skyviewer:${{ matrix.name }}_${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
